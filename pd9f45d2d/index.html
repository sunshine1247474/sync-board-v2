      function b64uToBytes(s){
        const pad = (4 - (s.length % 4)) % 4;
        const b64 = s.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat(pad);
        const bin = atob(b64);
        const out = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
        return out;
      }
      function b64ToBytes(b64){
        const bin = atob(b64);
        const out = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
        return out;
      }
      const hStr = location.hash || "";
      const pos = hStr.indexOf("k=");
      let k = pos >= 0 ? hStr.slice(pos + 2).split("&")[0] : null;

        else k = localStorage.getItem("__sb_k2");

        const html = new TextDecoder("utf-8").decode(dec);
        document.open();
        document.write(html);
        document.close();
